name: Deploy Backend (Staging)

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build app
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload package.json + yarn.lock
        uses: actions/upload-artifact@v4
        with:
          name: dependencies
          path: |
            package.json
            yarn.lock

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Download dependencies
        uses: actions/download-artifact@v4
        with:
          name: dependencies
          path: .

      - name: Set up SSH key
        run: |
          echo "${{ secrets.SSH_KEY_B64 }}" | base64 -D > private_key
          chmod 600 private_key

      - name: Deploy to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: private_key
          port: 22
          source: "dist/*, package.json, yarn.lock"
          target: "/root/apps/backend/slujst-backend"
          overwrite: true
          strip_components: 0

      - name: Restart app on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: private_key
          port: 22
          script: |
            cd /root/apps/backend/slujst-backend
            mkdir -p .yarn_cache
            yarn install --production --frozen-lockfile --cache-folder .yarn_cache
            pm2 reload slujst-backend || pm2 start dist/main.js --name slujst-backend
