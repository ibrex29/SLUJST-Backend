name: Deploy Backend (Staging)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug SSH key
        run: |
          echo "First 5 lines of key:"
          head -n 5 ~/.ssh/slujst_deploy_key
          echo "Last 5 lines of key:"
          tail -n 5 ~/.ssh/slujst_deploy_key

      - name: Setup SSH
        run: |
          echo "Setting up SSH..."
          mkdir -p ~/.ssh
          echo "$SLUJST_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/slujst_deploy_key
          chmod 600 ~/.ssh/slujst_deploy_key
          ssh-keyscan -H 203.161.43.7 >> ~/.ssh/known_hosts
          echo "SSH setup done. Listing ~/.ssh contents:"
          ls -al ~/.ssh

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection..."
          ssh -i ~/.ssh/slujst_deploy_key root@203.161.43.7 "echo 'SSH connection successful!'"

      - name: Deploy to server
        run: |
          echo "Starting deployment..."
          ssh -i ~/.ssh/slujst_deploy_key root@203.161.43.7 << 'EOF'
            set -e
            cd /root/apps/backend/slujst-backend
            echo "Fetching latest code from staging..."
            git fetch origin staging
            git reset --hard origin/staging
            echo "Installing dependencies..."
            mkdir -p .yarn_cache
            yarn install --production --frozen-lockfile --cache-folder .yarn_cache
            echo "Restarting backend with PM2..."
            pm2 reload slujst-backend || pm2 start dist/main.js --name slujst-backend
            echo "Deployment completed successfully!"
          EOF
