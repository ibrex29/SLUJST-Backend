name: Deploy Backend (Staging)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Setup SSH with the base64-encoded private key
      - name: Setup SSH
        run: |
          echo "Setting up SSH..."
          mkdir -p ~/.ssh
          echo "$SLUJST_DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/slujst_deploy_key
          chmod 600 ~/.ssh/slujst_deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          echo "SSH setup done. Listing ~/.ssh contents:"
          ls -al ~/.ssh

      # 4️⃣ Test SSH connection
      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/slujst_deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo 'SSH connection successful!'"

      # 5️⃣ Deploy the app via SSH
      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/slujst_deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            echo "Deploying backend..."
            cd /root/apps/backend/slujst-backend
            git fetch origin staging
            git reset --hard origin/staging
            mkdir -p .yarn_cache
            yarn install --production --frozen-lockfile --cache-folder .yarn_cache
            pm2 reload slujst-backend || pm2 start dist/main.js --name slujst-backend
            echo "Deployment complete."
          EOF
