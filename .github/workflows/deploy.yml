name: Deploy Backend (Staging)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via SSH and Git pull
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/apps/backend/slujst-backend || mkdir -p /root/apps/backend/slujst-backend && cd /root/apps/backend/slujst-backend
            git init
            git remote add origin git@github.com:<YOUR_USERNAME>/<YOUR_REPO>.git || true
            git fetch --all
            git reset --hard origin/staging
            mkdir -p .yarn_cache
            yarn install --production --frozen-lockfile --cache-folder .yarn_cache
            pm2 reload slujst-backend || pm2 start dist/main.js --name slujst-backend
          EOF
