name: Deploy Backend (Staging)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key from Base64
        run: |
          echo "$SLUJST_DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add GitHub to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Test SSH
        run: ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no git@github.com

      - name: Deploy or Run Commands
        run: |
          # your deployment commands here

