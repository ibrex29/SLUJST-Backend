name: SLUJST Backend Deployment - Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # 1️⃣ Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Install dependencies
      - name: Install dependencies
        run: |
          cd /root/applications/backend/SLUJST-Backend
          yarn install --frozen-lockfile

      # 3️⃣ Build the project
      - name: Build project
        run: |
          cd /root/applications/backend/SLUJST-Backend
          yarn build

      # 4️⃣ Start / Restart PM2 app
      - name: Start / Restart PM2 app
        run: |
          cd /root/applications/backend/SLUJST-Backend
          pm2 stop slujst-backend || true
          pm2 start dist/src/main.js --name slujst-backend --watch --env production
          pm2 save
